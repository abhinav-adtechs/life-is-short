# The iPhone + iPad app with its widgets, and the Mac app. XcodeGen turns this into LifeIsShort.xcodeproj (./bootstrap.sh);
# the project file isn't committed. The bundle id, server, version and team are in Config/Base.xcconfig (and your
# Local.xcconfig).
name: LifeIsShort
options:
  deploymentTarget:
    iOS: "17.0"
    macOS: "14.0"
  developmentLanguage: en
  createIntermediateGroups: true
  groupSortPosition: top
configFiles:
  Debug: Config/Base.xcconfig
  Release: Config/Base.xcconfig
settings:
  base:
    SWIFT_VERSION: "5.0"
    SWIFT_STRICT_CONCURRENCY: minimal
    DEAD_CODE_STRIPPING: YES
packages:
  LifeIsShortCore:
    path: Core
targets:
  LifeIsShort-iOS:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Shared
        excludes: ["Resources/**"]
      - path: Shared/Resources/Bridge.js
        buildPhase: resources
      - path: Shared/Resources/PrivacyInfo.xcprivacy
        buildPhase: resources
      - path: Shared/Resources/Assets.xcassets
      - path: Shared/Resources/Pages
        type: folder
        buildPhase: resources
      - path: iOS
        excludes: ["Info.plist", "*.entitlements"]
      - path: iOS/Info.plist
        buildPhase: none
      - path: iOS/LifeIsShort.entitlements
        buildPhase: none
      # The widgets' views, so the app can draw them for CI (iOS/WidgetGallery.swift); their pictures and type stay in
      # the widget extension, which the app carries.
      - path: Widgets/Design
      # The Lock Screen's Now (a Live Activity): its type and its Refresh and Show Now intents, which iOS runs in the app.
      - path: Widgets/Live
    dependencies:
      - package: LifeIsShortCore
        product: LifeIsShortCore
      - target: LifeIsShort-Widgets
        embed: true
    settings:
      base:
        PRODUCT_NAME: Life is short
        PRODUCT_MODULE_NAME: LifeIsShort
        PRODUCT_BUNDLE_IDENTIFIER: $(LIS_BUNDLE_ID)
        INFOPLIST_FILE: iOS/Info.plist
        CODE_SIGN_ENTITLEMENTS: iOS/LifeIsShort.entitlements
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        SUPPORTS_MACCATALYST: NO
        # The Mac gets its own app, so the iPad app isn't offered there too.
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
        SUPPORTS_XR_DESIGNED_FOR_IPHONE_IPAD: NO
    scheme: {}
  # The Home Screen and lock screen widgets and the Lock Screen's Now, a Live Activity (Widgets/, docs/apple.md →
  # Widgets and Live Activity), inside the iPhone and iPad app.
  LifeIsShort-Widgets:
    type: app-extension
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Widgets/Design
      # The Live Activity's type, to draw it, and its intents, for its buttons to name.
      - path: Widgets/Live
      - path: Widgets/Extension
        excludes: ["Info.plist", "*.entitlements"]
      - path: Widgets/Extension/Info.plist
        buildPhase: none
      - path: Widgets/Extension/LifeIsShortWidgets.entitlements
        buildPhase: none
      - path: Widgets/Resources/Scenes.xcassets
      - path: Widgets/Resources/Fonts
        buildPhase: resources
    dependencies:
      - package: LifeIsShortCore
        product: LifeIsShortCore
    settings:
      base:
        PRODUCT_NAME: LifeIsShortWidgets
        PRODUCT_MODULE_NAME: LifeIsShortWidgets
        PRODUCT_BUNDLE_IDENTIFIER: $(LIS_BUNDLE_ID).widgets
        INFOPLIST_FILE: Widgets/Extension/Info.plist
        CODE_SIGN_ENTITLEMENTS: Widgets/Extension/LifeIsShortWidgets.entitlements
        TARGETED_DEVICE_FAMILY: "1,2"
        SKIP_INSTALL: YES
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/Frameworks @executable_path/../../Frameworks"
  LifeIsShort-macOS:
    type: application
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - path: Shared
        excludes: ["Resources/**"]
      - path: Shared/Resources/Bridge.js
        buildPhase: resources
      - path: Shared/Resources/PrivacyInfo.xcprivacy
        buildPhase: resources
      - path: Shared/Resources/Assets.xcassets
      - path: Shared/Resources/Pages
        type: folder
        buildPhase: resources
      - path: macOS
        excludes: ["Info.plist", "*.entitlements"]
      - path: macOS/Info.plist
        buildPhase: none
      - path: macOS/LifeIsShort.entitlements
        buildPhase: none
    dependencies:
      - package: LifeIsShortCore
        product: LifeIsShortCore
    settings:
      base:
        PRODUCT_NAME: Life is short
        PRODUCT_MODULE_NAME: LifeIsShort
        PRODUCT_BUNDLE_IDENTIFIER: $(LIS_BUNDLE_ID)
        INFOPLIST_FILE: macOS/Info.plist
        CODE_SIGN_ENTITLEMENTS: macOS/LifeIsShort.entitlements
        ENABLE_HARDENED_RUNTIME: YES
        COMBINE_HIDPI_IMAGES: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    scheme: {}
